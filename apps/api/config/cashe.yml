# Rules for the unlock engine and gifts. Durations are in seconds.
shared:
  # How long a wallet stays spendable after an unlock (open decision in CLAUDE.md).
  spend_window_seconds: <%= ENV.fetch("CASHE_SPEND_WINDOW_SECONDS", 600) %>
  # An unclaimed gift refunds to its sender after this long (ADR 0002).
  claim_window_seconds: 259200
  # A gap between pings longer than this ends the presence session.
  ping_gap_seconds: 45
  # Pings less accurate than this are rejected.
  max_accuracy_m: 50
  # Faster than this between pings is an impossible jump (ADR 0004); about 250 km/h.
  max_speed_mps: 70
  allow_mock_locations: false
  # Custom scheme for now (opens the app directly); https App Links can replace it in Phase 4.
  claim_url_base: cashe://claim/
  currencies: [ZAR, USD, EUR, GBP]
