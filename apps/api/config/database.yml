# PostgreSQL + PostGIS. Development and test default to the Docker database
# from the repo's docker-compose.yml (port 5433). Set DATABASE_URL to point
# anywhere else; Rails merges it over these settings.
default: &default
  adapter: postgis
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5433 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "cashe" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "cashe" } %>

development:
  <<: *default
  database: cashe_development

test:
  <<: *default
  database: cashe_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
