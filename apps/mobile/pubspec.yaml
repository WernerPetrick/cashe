name: cashe
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  app_links: ^7.2.2
  appwrite: ^28.0.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.1
  go_router: ^18.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/cashe-logo.png
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  # Static instances of Manrope (cut from the variable font) and JetBrains Mono,
  # both SIL Open Font License 1.1; licences are registered in main.dart.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
