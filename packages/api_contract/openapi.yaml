openapi: 3.1.0
info:
  title: Cashe API
  version: 0.1.0
  description: Single source of truth for the Cashe API. Update in the same change as any endpoint.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - appwriteJwt: []
paths: {}
components:
  securitySchemes:
    appwriteJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived JWT issued by Appwrite Auth.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
