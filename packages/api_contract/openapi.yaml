openapi: 3.0.3
info:
  title: Cashe API
  version: 0.2.0
  description: |
    Single source of truth for the Cashe API. Update in the same change as any endpoint.
    Money is always integer cents plus an ISO currency code. Coordinates sent to the API
    are used for a check and discarded; none are returned except a place's public centre.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - appwriteJwt: []
paths:
  /session:
    post:
      operationId: createSession
      summary: Exchange an Appwrite JWT for the Cashe user (created on first call)
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /me:
    get:
      operationId: getMe
      summary: The current user
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /places:
    get:
      operationId: listNearbyPlaces
      summary: Places within 5 km of a point, nearest first (at most 50)
      parameters:
        - name: near
          in: query
          required: true
          description: "latitude,longitude, e.g. -33.9249,18.4241"
          schema: { type: string }
      responses:
        "200":
          description: Nearby places
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items: { $ref: "#/components/schemas/Place" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      operationId: createPlace
      summary: Add a place (adults only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceInput" }
      responses:
        "201":
          description: The new place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /wallets:
    get:
      operationId: listWallets
      summary: Wallets I own or funded, with computed balances
      responses:
        "200":
          description: My wallets, newest first
          content:
            application/json:
              schema:
                type: object
                required: [wallets]
                properties:
                  wallets:
                    type: array
                    items: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createWallet
      summary: Create a goal (owned by me) or a gift (claimed later through claim_url)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletInput" }
      responses:
        "201":
          description: The new wallet. For a gift, claim_url is shown here and never again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWallet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /wallets/{id}:
    parameters:
      - $ref: "#/components/parameters/WalletId"
    get:
      operationId: getWallet
      summary: A wallet's details, unlock rules and recent ledger entries
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /wallets/{id}/deposits:
    parameters:
      - $ref: "#/components/parameters/WalletId"
    post:
      operationId: createDeposit
      summary: Simulated top-up (funder only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountInput" }
      responses:
        "201":
          description: The deposit (or the original one, if idempotency_key was used before)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /wallets/{id}/presence_pings:
    parameters:
      - $ref: "#/components/parameters/WalletId"
    post:
      operationId: createPresencePing
      summary: Report location from the unlock screen (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresencePingInput" }
      responses:
        "200":
          description: Dwell progress, an unlock, or why not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PingOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /wallets/{id}/spends:
    parameters:
      - $ref: "#/components/parameters/WalletId"
    post:
      operationId: createSpend
      summary: Spend during an active unlock (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountInput" }
      responses:
        "201":
          description: The spend (or the original one, if idempotency_key was used before)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /wallets/{id}/ledger_entries:
    parameters:
      - $ref: "#/components/parameters/WalletId"
    get:
      operationId: listLedgerEntries
      summary: A wallet's history, newest first
      parameters:
        - name: before
          in: query
          description: Return entries older than this entry id (from next_before)
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /wallets/{id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/WalletId"
    post:
      operationId: cancelGift
      summary: Cancel a gift nobody has claimed yet and refund it (funder only)
      responses:
        "200":
          description: The cancelled gift
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /gift_claims:
    post:
      operationId: claimGift
      summary: Claim a gift with the token from its claim link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The claimed gift, now mine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    appwriteJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived JWT issued by Appwrite Auth (Account.createJWT).
  parameters:
    WalletId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    Unauthorized:
      description: Missing, expired or rejected JWT (code `unauthorized`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but not allowed to do this (code `forbidden`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such wallet among those I can see (code `not_found`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >-
        The wallet's state refuses this: `wallet_closed`, `wallet_locked`,
        `idempotency_conflict` or `not_cancellable`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: >-
        Invalid input or a refused rule: `validation_failed`, `invalid_location`, `invalid_ping`,
        `invalid_amount`, `invalid_idempotency_key`, `insufficient_funds`, `invalid_claim` or `own_gift`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit reached (code `rate_limited`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AuthUnavailable:
      description: Appwrite could not be reached to check the JWT (code `auth_unavailable`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Timestamp:
      type: string
      format: date-time
    User:
      type: object
      additionalProperties: false
      required: [id, display_name, role]
      properties:
        id: { type: integer }
        display_name: { type: string }
        role: { type: string, enum: [adult, child] }
    PlaceInput:
      type: object
      required: [name, latitude, longitude, radius_m, dwell_seconds]
      properties:
        name: { type: string, maxLength: 120 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radius_m: { type: integer, minimum: 10, maximum: 1000 }
        dwell_seconds: { type: integer, minimum: 10, maximum: 3600 }
    Place:
      type: object
      additionalProperties: false
      required: [id, name, latitude, longitude, radius_m, dwell_seconds]
      properties:
        id: { type: integer }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        radius_m: { type: integer }
        dwell_seconds: { type: integer }
        distance_m:
          type: integer
          description: Only on nearby-search results
    TimeWindow:
      type: object
      additionalProperties: false
      required: [days_of_week, starts_at, ends_at, time_zone]
      properties:
        days_of_week:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 0 = Sunday … 6 = Saturday
        starts_at: { type: string, pattern: "^\\d{2}:\\d{2}$", example: "10:30" }
        ends_at:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
          example: "11:00"
          description: Exclusive, and after starts_at (no windows across midnight)
        time_zone: { type: string, example: Africa/Johannesburg }
    WalletInput:
      type: object
      required: [kind, name, place_id, currency]
      properties:
        kind: { type: string, enum: [goal, gift] }
        name: { type: string, maxLength: 100 }
        place_id: { type: integer }
        currency: { type: string, enum: [ZAR, USD, EUR, GBP] }
        target_cents: { type: integer, minimum: 1, nullable: true }
        expires_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          nullable: true
          description: Gifts only. Unspent money refunds to the sender then; null = never.
        time_windows:
          type: array
          items: { $ref: "#/components/schemas/TimeWindow" }
          description: None = any time
    Wallet:
      type: object
      required: [id, kind, name, status, role, place, currency, balance_cents, funded_cents, target_cents,
        expires_at, claim_expires_at, claimed_at, funder_name, owner_name]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [goal, gift] }
        name: { type: string }
        status: { type: string, enum: [pending, active, cancelled, expired] }
        role:
          type: string
          enum: [owner, funder]
          description: My relationship to this wallet (a goal's owner is also its funder)
        place:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        currency: { type: string }
        balance_cents: { type: integer }
        funded_cents:
          type: integer
          description: Everything ever deposited, before spends and refunds ("R34 of R80 left")
        target_cents: { type: integer, nullable: true }
        expires_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          nullable: true
        claim_expires_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          nullable: true
          description: When an unclaimed gift refunds to its sender
        claimed_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          nullable: true
        funder_name: { type: string }
        owner_name:
          type: string
          nullable: true
          description: Null until a gift is claimed ("Claimed by <owner_name>")
    WalletDetail:
      allOf:
        - $ref: "#/components/schemas/Wallet"
        - type: object
          required: [place, time_windows, recent_entries, unlocked_until]
          properties:
            place: { $ref: "#/components/schemas/Place" }
            time_windows:
              type: array
              items: { $ref: "#/components/schemas/TimeWindow" }
            recent_entries:
              type: array
              maxItems: 10
              items: { $ref: "#/components/schemas/LedgerEntry" }
            unlocked_until:
              allOf: [{ $ref: "#/components/schemas/Timestamp" }]
              nullable: true
              description: End of the active spend window. Shown to the owner only.
    CreatedWallet:
      allOf:
        - $ref: "#/components/schemas/WalletDetail"
        - type: object
          required: [claim_url]
          properties:
            claim_url:
              type: string
              nullable: true
              description: A gift's one-time claim link (cashe://claim/<token>); null for goals
    AmountInput:
      type: object
      required: [amount_cents, idempotency_key]
      properties:
        amount_cents: { type: integer, minimum: 1 }
        idempotency_key:
          type: string
          maxLength: 100
          description: Unique per request; resending the same key returns the original entry
    LedgerEntry:
      type: object
      additionalProperties: false
      required: [id, kind, amount_cents, currency, place_name, created_at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [deposit, spend, refund] }
        amount_cents:
          type: integer
          description: Positive for deposits, negative for spends and refunds
        currency: { type: string }
        place_name:
          type: string
          nullable: true
          description: Where a spend happened; null for other kinds
        created_at: { $ref: "#/components/schemas/Timestamp" }
    LedgerPage:
      type: object
      additionalProperties: false
      required: [entries, next_before]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        next_before:
          type: integer
          nullable: true
          description: Pass as `before` for the next page; null on the last page
    PresencePingInput:
      type: object
      required: [latitude, longitude, accuracy_m]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: number, minimum: 0 }
        is_mocked: { type: boolean, default: false }
    PingOutcome:
      type: object
      additionalProperties: false
      required: [status, inside_zone, in_time_window, dwell_progress_seconds, dwell_required_seconds,
        unlocked_until, reason]
      properties:
        status: { type: string, enum: [outside_zone, outside_time_window, dwelling, unlocked, rejected] }
        inside_zone:
          type: boolean
          nullable: true
          description: Null when the ping was rejected
        in_time_window:
          type: boolean
          nullable: true
          description: Null when the ping was rejected
        dwell_progress_seconds: { type: integer }
        dwell_required_seconds: { type: integer, nullable: true }
        unlocked_until:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          nullable: true
        reason:
          type: string
          enum: [mock_location, low_accuracy]
          nullable: true
          description: Why a ping was rejected
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { type: string }
