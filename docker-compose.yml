services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: cashe
      POSTGRES_PASSWORD: cashe
      POSTGRES_DB: cashe_development
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
